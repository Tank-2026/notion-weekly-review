name: Weekly Review

on:
  schedule:
    # ⏰ 每天 00:00 UTC = 北京时间 08:00
    #   只有一个定时 —— 脚本自己判断今天该跑什么，从根上避免周/月复盘并发抓数：
    #     周六   → 周复盘（生成「周复盘」页面正文 + 写「复盘记录数据库」+ 刷新 KR 快照）
    #     1 号   → 月度复盘（模板待设计）
    #     其他日 → 直接跳过，不做任何写入
    #   注：1 号恰好是周六时（如 2027-05-01），两个任务在同一次运行内串行完成。
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Run review
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          WRITE_TO_NOTION: '1'
          # 手动触发时强制跑周复盘（方便随时补跑/调试）；定时触发则交给脚本按日期判断
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: python review.py
