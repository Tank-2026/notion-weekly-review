name: Weekly Review

on:
  schedule:
    # 每周六 00:00 UTC = 北京时间周六 08:00
    #   → 生成「周复盘」页面正文（六板块）+ 写入「复盘记录数据库」（指标 + 三件追踪）
    - cron: '0 0 * * 6'
    # 每月 1 号 00:00 UTC = 北京时间 1 号 08:00
    #   → 月度复盘（当前复用同一正文；月度模板可后续扩展）
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Run review
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          WRITE_TO_NOTION: '1'
        run: python review.py
